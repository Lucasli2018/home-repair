# Cloudflare Pages 项目配置
# 部署命令：wrangler pages deploy . --project-name=home-repair
# 本地开发：wrangler pages dev --port 8787 --persist-to ./.wrangler-dev

name = "home-repair"
pages_build_output_dir = "public"

compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（本地名 DB，对应后端 env.DB）
# 共享 dev 库（多项目共用，本项目表统一带 hr_ 前缀，互不冲突）
[[d1_databases]]
binding = "DB"
database_name = "dev"
database_id = "3c83aee3-4645-450b-b50b-6488750deeb4"

# R2 存储绑定（本地名 R2，对应后端 env.R2）
[[r2_buckets]]
binding = "R2"
bucket_name = "home-repair-images"

# 部署前先在 Cloudflare Dashboard 创建 D1 database 和 R2 bucket，
# 然后把上面的 database_id / bucket_name 换成你实际的值。
# 详见 README.md 的「第一次部署」章节。
